name: Research offense defense internal weights

on:
  push:
    branches:
      - research/offense-defense-internal-weights-2026-10-11
    paths:
      - 'research/offense_defense_weights_2026_10_11/**'
      - '.github/workflows/offense-defense-weights.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cfb-offense-defense-weights
  cancel-in-progress: false

jobs:
  run-weight-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing model dependencies
        run: pip install pandas==2.2.3 numpy==2.2.6 scipy==1.15.3
      - name: Run offense defense internal-weight sensitivity
        run: PYTHONPATH=. python research/offense_defense_weights_2026_10_11/run.py
      - name: Commit result to research branch only
        if: github.ref == 'refs/heads/research/offense-defense-internal-weights-2026-10-11'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/offense_defense_weights_2026_10_11/results.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record offense defense internal weight research'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

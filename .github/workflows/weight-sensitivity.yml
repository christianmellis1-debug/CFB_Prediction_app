name: Research V1.5 main weights

on:
  push:
    branches:
      - research/model-weight-sensitivity-2026-10-11
    paths:
      - 'research/weight_sensitivity_2026_10_11/**'
      - '.github/workflows/weight-sensitivity.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cfb-weight-sensitivity
  cancel-in-progress: false

jobs:
  weights:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing model dependencies
        run: pip install pandas==2.2.3 numpy==2.2.6 scipy==1.15.3
      - name: Run lookahead-safe research sensitivity
        run: PYTHONPATH=. python research/weight_sensitivity_2026_10_11/run.py
      - name: Save research result only on experiment branch
        if: github.ref == 'refs/heads/research/model-weight-sensitivity-2026-10-11'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/weight_sensitivity_2026_10_11/results.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record historical weight sensitivity research'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

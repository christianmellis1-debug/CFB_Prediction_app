name: Tier4 2024 Holdout
on:
  push:
    branches:
      - research/tier5-2026-snapshot-20261007
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pandas
      - shell: bash
        run: |
          python - <<'PY'
          import json, math, urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import pandas as pd

          s=pd.read_csv("https://raw.githubusercontent.com/sportsdataverse/cfbfastR-data/main/schedules/csv/cfb_schedules_2024.csv",low_memory=False)
          s=s[
            s.season_type.astype(str).str.lower().eq("regular") &
            s.home_division.astype(str).str.lower().eq("fbs") &
            s.away_division.astype(str).str.lower().eq("fbs") &
            s.completed.fillna(False).astype(bool) &
            s.home_points.notna() & s.away_points.notna()
          ].copy()
          s=s.dropna(subset=["game_id"]).copy()

          def ml(v):
              if isinstance(v,dict): v=v.get("american",v.get("alternateDisplayValue"))
              if v is None:return None
              try:
                  x=float(str(v).replace("+","").replace("−","-").strip())
                  return int(x) if math.isfinite(x) and x.is_integer() else None
              except:return None
          def imp(x): return 100/(x+100) if x>0 else -x/(-x+100)

          def fetch(row):
              gid=str(int(row.game_id))
              try:
                  req=urllib.request.Request("https://site.api.espn.com/apis/site/v2/sports/football/college-football/summary?event="+gid,headers={"User-Agent":"Mozilla/5.0"})
                  with urllib.request.urlopen(req,timeout=20) as resp:p=json.load(resp)
              except:return None
              comp=(p.get("header",{}).get("competitions") or [{}])[0]
              for odds in (p.get("pickcenter",[]) or comp.get("odds",[]) or []):
                  name=str((odds.get("provider") or {}).get("name",""))
                  vals={}
                  m=odds.get("moneyline",{})
                  for side in ("home","away"):
                      v=((m.get(side) or {}).get("close") or {}).get("odds")
                      if v is None:v=(odds.get(side+"TeamOdds") or {}).get("moneyLine")
                      vals[side]=ml(v)
                  if vals["home"] is None or vals["away"] is None:continue
                  fav="home" if imp(vals["home"])>imp(vals["away"]) else "away"
                  winner="home" if float(row.home_points)>float(row.away_points) else "away"
                  return dict(game_id=int(gid),week=int(row.week),provider=name,
                              favorite=row.home_team if fav=="home" else row.away_team,
                              underdog=row.away_team if fav=="home" else row.home_team,
                              fav_ml=vals[fav],fav_side=fav,won=fav==winner,
                              home_points=float(row.home_points),away_points=float(row.away_points))
              return None

          rows=[]
          with ThreadPoolExecutor(max_workers=12) as ex:
              futs=[ex.submit(fetch,r) for _,r in s.iterrows()]
              for f in as_completed(futs):
                  x=f.result()
                  if x:rows.append(x)
          d=pd.DataFrame(rows)
          print("PROVIDERS")
          print(d.provider.value_counts().to_string() if "provider" in d else "none")
          d=d[d.fav_ml<=-505].copy()

          for label,mask in [
              ("ALL",pd.Series(True,index=d.index)),
              ("WEEK3PLUS",d.week>=3),
              ("WEEK4PLUS",d.week>=4)
          ]:
              x=d[mask]
              w=int(x.won.sum());l=len(x)-w
              print(f"{label}: {w}-{l} ({w/len(x):.1%}) n={len(x)}")
          print("\nLOSSES_ALL")
          print(d[~d.won][["week","favorite","underdog","fav_ml","fav_side","home_points","away_points"]].sort_values(["week","fav_ml"]).to_string(index=False))
          print("\nLOSSES_WEEK4PLUS")
          print(d[(d.week>=4)&(~d.won)][["week","favorite","underdog","fav_ml","fav_side","home_points","away_points"]].sort_values(["week","fav_ml"]).to_string(index=False))
          PY

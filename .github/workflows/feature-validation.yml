name: Feature validation
on:
  push:
    branches: [feature/6of6-ats-spreads]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/6of6-ats-spreads
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.2.6 pandas==2.2.3 scipy==1.15.3
      - run: python -m py_compile matchup_advantages.py model_v1_5.py app.py backend/main.py
      - run: python -m unittest discover -s tests -p 'test_*.py'

name: Tier5 2026 Lines
on:
  push:
    branches:
      - research/tier5-2026-snapshot-20261007
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pandas
      - name: Pull matchup lines
        shell: bash
        run: |
          python - <<'PY'
          import pandas as pd, urllib.request
          url="https://github.com/sportsdataverse/sportsdataverse-data/releases/download/cfb_matchup_line/cfb_matchup_line_2026.csv"
          urllib.request.urlretrieve(url,"lines.csv")
          df=pd.read_csv("lines.csv",low_memory=False)
          print("COLUMNS")
          print(list(df.columns))
          ids={401858231,401858458,401856703,401858479,401858475}
          gid=None
          for c in df.columns:
              if c.lower() in ("game_id","gameid","id"):
                  gid=c; break
          if gid:
              x=df[pd.to_numeric(df[gid],errors="coerce").isin(ids)].copy()
          else:
              masks=[]
              for c in df.columns:
                  if "team" in c.lower():
                      masks.append(df[c].astype(str).str.contains("Duke|UCLA|Mississippi State|Wisconsin|Nebraska",case=False,na=False))
              mask=masks[0]
              for m in masks[1:]: mask |= m
              x=df[mask].copy()
          keep=[c for c in df.columns if any(k in c.lower() for k in ["game","week","home","away","spread","money","line","odds","provider","book","team"])]
          print("\nMATCHING ROWS")
          print(x[keep].to_string(index=False))
          PY

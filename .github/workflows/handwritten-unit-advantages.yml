name: Analyze handwritten offense defense advantage win rates

on:
  push:
    branches:
      - research/handwritten-unit-advantages-2026-10-12
    paths:
      - 'research/handwritten_offense_defense_2026_10_12/**'
      - 'tests/test_handwritten_unit_advantages.py'
      - '.github/workflows/handwritten-unit-advantages.yml'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: cfb-handwritten-unit-advantage-research
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed analytics dependencies
        run: pip install pandas==2.2.3 numpy==2.2.6 scipy==1.15.3
      - name: Validate exact formula and directional win-rate grading
        run: |
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_handwritten_offense_defense.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_handwritten_unit_advantages.py' -v
      - name: Compare offense, defense, and both on identical earlier-week games
        run: PYTHONPATH=. python research/handwritten_offense_defense_2026_10_12/unit_advantages.py
      - name: Save frozen historical analysis on research branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/handwritten_offense_defense_2026_10_12/unit_advantage_results.json
          if ! git diff --cached --quiet; then
            git commit -m 'Save offense defense both advantage historical win rates'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

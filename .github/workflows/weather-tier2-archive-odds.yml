name: Weather Tier 2 archived odds grading
on:
  push:
    branches: [research/weather-tier2-parallel-recovery]
    paths:
      - research/weather_tier2_market_validation/run.py
      - .github/workflows/weather-tier2-archive-odds.yml
permissions:
  contents: write
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/weather-tier2-parallel-recovery
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==2.2.3
      - run: python -u research/weather_tier2_market_validation/run.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/weather_tier2_market_validation
          if ! git diff --cached --quiet; then
            git commit -m 'Grade recovered weather Tier 2 with archived odds'
            git push origin HEAD:research/weather-tier2-parallel-recovery
          fi
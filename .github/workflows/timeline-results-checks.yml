name: Timeline result badge checks
on:
  push:
    branches: [ui/timeline-model-results-20261009]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile and run all regression tests
        run: |
          python -m compileall -q app.py model_v1_5.py matchup_advantages.py
          python -m unittest discover -s tests -p 'test_*.py' -v

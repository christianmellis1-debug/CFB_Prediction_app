name: Research Test D2 EPA fallback
on:
  push:
    branches:
      - research/test-d-epa-fallback-2026-10-13
    paths:
      - 'research/test_d_epa_fallback.py'
      - '.github/workflows/research-test-d-epa-fallback.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: research-test-d-epa-fallback
  cancel-in-progress: false
jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==2.2.3 numpy==2.2.6 scipy==1.15.3
      - name: Check research script syntax
        run: python -m py_compile research/test_d_epa_fallback.py
      - name: Backtest missing adjusted EPA alternative data treatments
        run: PYTHONPATH=. python -u research/test_d_epa_fallback.py
      - name: Save results to research branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/test_d_epa_fallback_results.json research/test_d_epa_fallback_games.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Record Test D2 EPA fallback backtest results'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

name: Archive official Saturday Forecast Value tiers

on:
  schedule:
    - cron: '43 1,7,13,19 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - audit/immutable-value-archive-2026-10-11
    paths:
      - 'value_archive.py'
      - 'capture_value.py'
      - 'research/week6_value_tier_audit.py'
      - 'tests/test_value_archive.py'
      - '.github/workflows/value-archive.yml'

permissions:
  contents: write
concurrency:
  group: saturday-forecast-value-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing model requirements
        run: pip install numpy==2.2.6 pandas==2.2.3 scipy==1.15.3
      - name: Verify archive and waterfall grading
        run: |
          python -m unittest discover -s tests -p 'test_value_archive.py'
          python -m unittest discover -s tests -p 'test_waterfall.py'
      - name: Reconstruct Week 6 tier results on research branch only
        if: github.ref == 'refs/heads/audit/immutable-value-archive-2026-10-11' || github.event_name == 'workflow_dispatch'
        run: python research/week6_value_tier_audit.py
      - name: Capture and settle immutable official Value Shortlist decisions
        run: python capture_value.py
      - name: Commit research and newly settled results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/value_archive_2026.json
          if test -f research/2026_week6_value_tier_audit.json; then
            git add research/2026_week6_value_tier_audit.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Record locked Value Shortlist observations and tier audit'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

name: Research handwritten advantage size and market controls

on:
  push:
    branches:
      - research/handwritten-magnitude-market-2026-10-12
    paths:
      - 'research/handwritten_offense_defense_2026_10_12/magnitude_market.py'
      - 'tests/test_handwritten_magnitude_market.py'
      - '.github/workflows/handwritten-magnitude-market.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cfb-handwritten-magnitude-market
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed numerical dependencies
        run: pip install pandas==2.2.3 numpy==2.2.6 scipy==1.15.3
      - name: Test magnitude bins and matched favorite controls
        run: |
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_handwritten_magnitude_market.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_handwritten_home_field.py'
      - name: Compare magnitude and season-spread-matched home favorites
        run: PYTHONPATH=. python research/handwritten_offense_defense_2026_10_12/magnitude_market.py
      - name: Preserve prior research timestamp when result is otherwise identical
        run: |
          python - <<'PY'
          import json, pathlib, subprocess
          path=pathlib.Path("research/handwritten_offense_defense_2026_10_12/magnitude_market_results.json")
          old=subprocess.run(["git","show","HEAD:"+path.as_posix()],
                             text=True,capture_output=True)
          if old.returncode==0:
              before,after=json.loads(old.stdout),json.loads(path.read_text())
              before.pop("generated_at",None)
              after.pop("generated_at",None)
              if before==after:
                  path.write_text(old.stdout)
                  print("Only generated_at differed; no research data changes")
          PY
      - name: Commit research-only results and detailed 2026 games
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/handwritten_offense_defense_2026_10_12/magnitude_market_results.json
          git add research/handwritten_offense_defense_2026_10_12/magnitude_market_games_2026.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Archive 2022-2026 handwritten offense defense magnitude and market comparisons'
            for attempt in 1 2 3; do
              git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                exit 0
              fi
              echo "Remote branch changed during save; retrying"
            done
            exit 1
          fi

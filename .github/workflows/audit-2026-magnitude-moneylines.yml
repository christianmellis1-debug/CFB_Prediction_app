name: Verify 2026 Week 3-6 moneylines for magnitude study
on:
  push:
    branches:
      - research/handwritten-2026-moneylines-2026-10-12
    paths:
      - 'research/handwritten_offense_defense_2026_10_12/audit_moneylines.py'
      - '.github/workflows/audit-2026-magnitude-moneylines.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: handwritten-moneyline-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read game summary odds without inventing any prices
        run: PYTHONPATH=. python research/handwritten_offense_defense_2026_10_12/audit_moneylines.py
      - name: Archive historical moneyline source coverage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/handwritten_offense_defense_2026_10_12/moneyline_audit_2026.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record ESPN 2026 game-summary moneyline availability'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

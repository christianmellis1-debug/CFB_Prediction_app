name: Research handwritten offense defense weights

on:
  push:
    branches:
      - research/handwritten-offense-defense-2026-10-12
    paths:
      - 'research/handwritten_offense_defense_2026_10_12/**'
      - 'tests/test_handwritten_offense_defense.py'
      - '.github/workflows/handwritten-weights.yml'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: cfb-handwritten-offense-defense-research
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model dependencies
        run: pip install pandas==2.2.3 numpy==2.2.6 scipy==1.15.3
      - name: Run isolated handwritten model tests
        run: |
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_handwritten_offense_defense.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_rush_weight_research.py'
      - name: Compare same-cohort V1.5 and user's exact weights for 2022-2026
        run: PYTHONPATH=. python research/handwritten_offense_defense_2026_10_12/run.py
      - name: Persist reproducible research results on research branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/handwritten_offense_defense_2026_10_12/results.json
          if ! git diff --cached --quiet; then
            git commit -m 'Archive handwritten formula historical backtest results'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

name: Validate weather Tier 2 feature
on:
  push:
    branches: [feature/weather-tier2-ats]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/weather-tier2-ats
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_waterfall -v
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile matchup_advantages.py model_v1_5.py app.py backend/main.py weather_context.py
      - name: Smoke test weather feeds
        run: |
          python - <<'PY'
          import pandas as pd
          from weather_context import build_weather_context
          url='https://raw.githubusercontent.com/sportsdataverse/cfbfastR-data/main/schedules/csv/cfb_schedules_2026.csv'
          s=pd.read_csv(url, low_memory=False)
          hist=build_weather_context(s, 5, [401856710])
          assert hist['401856710']['status']=='ok' and hist['401856710']['inclement'] is True, hist
          future=build_weather_context(s, 6, [401858258])
          assert future['401858258']['status']=='ok', future
          print('historical', hist['401856710'])
          print('week6', future['401858258'])
          PY
name: Inspect spread payload
on:
  push:
    branches: [feature/6of6-ats-spreads]
    paths:
      - research/inspect_spread_payload.py
      - .github/workflows/inspect-spread-payload.yml
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/6of6-ats-spreads
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/inspect_spread_payload.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/spread_payload_sample.json
          git commit -m 'Capture ESPN spread payload sample' || exit 0
          git push origin HEAD:feature/6of6-ats-spreads

name: Research Test D impact on current Test C
on:
  push:
    branches:
      - research/test-d-missing-data-early-season-2026-10-13
    paths:
      - 'research/test_d_market_impact.py'
      - '.github/workflows/research-test-d-market-impact.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: research-test-d-market-impact
  cancel-in-progress: false
jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==2.2.3 numpy==2.2.6
      - run: python -m py_compile research/test_d_market_impact.py
      - name: Compare fixed Test C with Test D V1.5 candidate inputs
        run: python research/test_d_market_impact.py
      - name: Save Test D market impact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/test_d_market_impact.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record Test D impact on Test C blended winner'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

name: Research Test F2 direct market residual
on:
  push:
    branches:
      - research/test-f-rush-pass-specific-matchups-2026-10-13
    paths:
      - 'research/test_f_direct_residual.py'
      - '.github/workflows/test-f-direct-residual.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: test-f-direct-residual
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==2.2.3 numpy==2.2.6 scipy==1.15.3
      - run: python -m py_compile research/test_f_direct_residual.py
      - name: Test passing matchup residual against test C
        run: PYTHONPATH=. python research/test_f_direct_residual.py
      - name: Preserve research results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/test_f_direct_residual_results.json research/test_f_direct_changed_games.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Record passing matchup direct Test C residual validation'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

name: Tier 4 2020 holdout
on:
  push:
    branches: [research/tier4-90pct-validation]
    paths:
      - research/tier4_90pct_validation/validate_2020.py
      - .github/workflows/tier4-2020-holdout.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -u research/tier4_90pct_validation/validate_2020.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/tier4_90pct_validation/tier4_2020_holdout.csv research/tier4_90pct_validation/tier4_2020_summary.json research/tier4_90pct_validation/tier4_2020_errors.csv
          git commit -m 'Record untouched 2020 Tier 4 holdout' || exit 0
          git push origin HEAD:research/tier4-90pct-validation
name: Tier 3 Gold Underdog validation
on:
  push:
    branches: [research/tier3-gold-underdog-validation]
    paths:
      - research/tier3_gold_underdog_validation/run.py
      - .github/workflows/tier3-gold-underdog-validation.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -u research/tier3_gold_underdog_validation/run.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/tier3_gold_underdog_validation
          git commit -m 'Record Tier 3 Gold Underdog validation' || exit 0
          git push origin HEAD:research/tier3-gold-underdog-validation
name: Test C historical blend audit 2024-2025
on:
  push:
    branches:
      - research/test-c-historical-blend-2024-2025-2026-10-13
    paths:
      - 'research/test_c_blend_2024_2025.py'
      - '.github/workflows/test-c-historical-blend-2024-2025.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: test-c-historical-blend-2024-2025
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: pip install pandas==2.2.3 numpy==2.2.6 scipy==1.15.3
      - name: Check script
        run: python -m py_compile research/test_c_blend_2024_2025.py
      - name: Evaluate fixed blend using 2024 and 2025 archived odds
        run: PYTHONPATH=. python research/test_c_blend_2024_2025.py
      - name: Save separate research evidence (no production model changes)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/test_c_blend_2024_2025_results.json research/test_c_blend_2024_2025_games.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Record Test C 2024-2025 historical paired audit'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

name: Test C vs V1.5 Weeks 3-6
on:
  push:
    branches:
      - research/test-c-head-to-head-weeks3-6-2026-10-13
    paths:
      - 'research/test_c_head_to_head_weeks3_6.py'
      - '.github/workflows/test-c-head-to-head-weeks3-6.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: test-c-head-to-head-weeks3-6
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==2.2.3 numpy==2.2.6 scipy==1.15.3
      - run: python -m py_compile research/test_c_head_to_head_weeks3_6.py
      - name: Evaluate DraftKings opening lines and V1.5 weeks 3-6
        run: PYTHONPATH=. python research/test_c_head_to_head_weeks3_6.py
      - name: Save isolated research outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/test_c_head_to_head_weeks3_6_results.json research/test_c_head_to_head_weeks3_6_games.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Record Weeks 3-6 V1.5 versus Test C results'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

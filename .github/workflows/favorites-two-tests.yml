name: Fixed favorite-spread candidate tier A B backtest
on:
  push:
    branches:
      - research/handwritten-favorites-two-tests-2026-10-12
    paths:
      - 'research/handwritten_offense_defense_2026_10_12/favorites_two_tests.py'
      - 'tests/test_favorites_two_tests.py'
      - '.github/workflows/favorites-two-tests.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: handwritten-favorites-two-tests
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned statistical dependencies
        run: pip install pandas==2.2.3 numpy==2.2.6 scipy==1.15.3
      - name: Validate fixed rules and spread boundaries
        run: |
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_favorites_two_tests.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_handwritten_same_group.py' -v
      - name: Run 2023-2026 identical historical candidate comparison
        run: PYTHONPATH=. python research/handwritten_offense_defense_2026_10_12/favorites_two_tests.py
      - name: Commit independent research results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/handwritten_offense_defense_2026_10_12/favorites_two_test_results.json 2>/dev/null || true
          git add research/handwritten_offense_defense_2026_10_12/favorites_two_tests_results.json 2>/dev/null || true
          git add research/handwritten_offense_defense_2026_10_12/favorites_two_test_games.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Archive historical spread-limited and all-favorite candidate outcomes'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

name: Validate Official Tier 5
on:
  push:
    branches:
      - feature/official-tier5-four-factor
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest tests/test_waterfall.py tests/test_matchup_advantages.py -q

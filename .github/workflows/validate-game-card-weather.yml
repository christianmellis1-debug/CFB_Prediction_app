name: Validate game-card weather
on:
  push:
    branches: [feature/game-card-weather-forecast]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m py_compile app.py weather_context.py matchup_advantages.py model_v1_5.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
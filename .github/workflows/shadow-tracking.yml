name: Capture prospective model comparison
on:
  schedule:
    - cron: '17 2,8,14,20 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/shadow-tracking.yml'
      - 'capture_shadow.py'
      - 'shadow_tracking.py'
      - 'shadow_inputs.py'
      - 'shadow_model_v1_5.py'
permissions:
  contents: write
concurrency:
  group: prospective-cfb-captures
  cancel-in-progress: false
jobs:
  capture:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.2.6 pandas==2.2.3 scipy==1.15.3
      - run: python -m unittest discover -s tests -p 'test_shadow_tracking.py'
      - run: python capture_shadow.py
      - name: Save captures and settlements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/shadow_tracking.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record prospective CFB comparison snapshots'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
